##################################################
# goda-pm.vim ecosystem.
# NOTE: goda.vim itself is registered in merge.toml, not here: every
# plugin loaded from this file defaults to "depends: goda.vim" (see
# main.go), so registering goda.vim here would make it depend on itself.
##################################################

[[plugins]]
repo = "Shougo/goda-pm.vim"
rtp = ""
lua_add = """
  vim.api.nvim_create_user_command("GodaPmInstall", function()
    require("goda_pm").async_ext_action("installer", "install")
  end, {})
  vim.api.nvim_create_user_command("GodaPmUpdate", function(opts)
    require("goda_pm").async_ext_action("installer", "update", { names = opts.fargs })
  end, { nargs = "*" })
"""

[[plugins]]
repo = "Shougo/goda-pm-ext-lazy.vim"
lazy = false

##################################################
# plugins depending on goda.vim go here.
##################################################

[[plugins]] # terminal/shell UIs; the successor of ddt.vim
repo = "Shougo/goda-term.vim"
hooks_file = "$VIM_CONFIG_PATH/rc/goda-term.vim"
hook_post_update = '''
  call goda_term#build()
'''

[[plugins]]
repo = "Shougo/goda-term-ui-shell.vim"
on_source = "goda-term.vim"

[[plugins]]
repo = "Shougo/goda-term-ui-terminal.vim"
on_source = "goda-term.vim"
