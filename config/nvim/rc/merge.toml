hooks_file = "$VIM_CONFIG_PATH/rc/ft.vim"

##################################################
# goda-pm.vim ecosystem (goda.vim itself; see goda.toml for the rest) #
##################################################

[[plugins]]
repo = "Shougo/goda.vim"

##################################################
# color scheme ###################################
##################################################

[[plugins]]
repo = "catppuccin/vim"
name = "catppuccin"
hook_add = '''
  colorscheme catppuccin_macchiato
'''

##################################################
# Denops #########################################
##################################################

[[plugins]]
repo = "vim-denops/denops.vim"
lua_source = """
  vim.g["denops#server#deno_args"] = {
    "-q",
    "--no-check",  -- skip type checking for faster startup
    "-A",
  }
  -- vim.g["denops#debug"] = 1
"""
