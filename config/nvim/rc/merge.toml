hooks_file = "$VIM_CONFIG_PATH/rc/ft.vim"

##################################################
# goda-pm.vim ecosystem (goda.vim itself; see goda.toml for the rest) #
##################################################

[[plugins]]
repo = "Shougo/goda.vim"

##################################################
# color scheme ###################################
##################################################

[[plugins]]
repo = "catppuccin/vim"
name = "catppuccin"
hook_add = '''
  colorscheme catppuccin_macchiato
'''

##################################################
# Denops #########################################
##################################################

[[plugins]]
repo = "vim-denops/denops.vim"
lua_source = """
  vim.g["denops#server#deno_args"] = {
    "-q",
    "--no-check",  -- skip type checking for faster startup
    "-A",
    "--unstable-ffi", -- for ddt-ui-shell
  }
  -- vim.g["denops#debug"] = 1
"""

##################################################
# ddt.vim ########################################
##################################################

[[plugins]]
repo = "Shougo/ddt.vim"
depends = "denops.vim"
hooks_file = "$VIM_CONFIG_PATH/rc/ddt.lua"

[[plugins]]
repo = "Shougo/ddt-ui-terminal"
on_source = "ddt.vim"

[[plugins]]
repo = "Shougo/ddt-ui-shell"
on_source = "ddt.vim"

[[plugins]]
repo = "lambdalisue/vim-guise"
on_source = "ddt.vim"
