##################################################
# color scheme ###################################
##################################################

[[plugins]]
repo = "catppuccin/nvim"
name = "catppuccin"
lua_add = """
  vim.cmd("colorscheme catppuccin-macchiato")
"""

##################################################
# Denops #########################################
##################################################

[[plugins]]
repo = "vim-denops/denops.vim"
lua_source = """
  vim.g["denops#server#deno_args"] = {
    "-q",
    "--no-check",  -- skip type checking for faster startup
    "-A",
    "--unstable-ffi", -- for ddt-ui-shell
  }
  -- vim.g["denops#debug"] = 1
"""

##################################################
# Lua ############################################
##################################################

[[plugins]]
repo = "nvim-lua/plenary.nvim"

##################################################
# others #########################################
##################################################

[[plugins]] # nerd icons
repo = "nvim-tree/nvim-web-devicons"

[[plugins]] # statusline on the bottom
repo = "nvim-lualine/lualine.nvim"
depends = ["catppuccin", "nvim-web-devicons"]
lua_source = """
  local lsp_names = function()
    local clients = vim
      .iter(vim.lsp.get_clients { bufnr = 0 })
      :map(function(client)
        if client.name == 'null-ls' then
          return ('null-ls(%s)'):format(table.concat(
            vim
              .iter(require('null-ls.sources').get_available(vim.bo.filetype))
              :map(function(source)
                return source.name
              end)
              :totable(),
            ', '
          ))
        else
          return client.name
        end
      end)
      :totable()
    return ' ' .. table.concat(clients, ', ')
  end

  require("lualine").setup({
    options = {
      theme = "auto",
    },
    sections = {
      lualine_x = { lsp_names, "encoding", "fileformat", "filetype" },
    },
  })
"""
