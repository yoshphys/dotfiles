##################################################
# inc/decrement ##################################
##################################################

[[plugins]]
repo = "monaqa/dps-dial.vim"
depends = "denops.vim"
on_map = "<Plug>(dps-dial"
lua_source = '''
  vim.g["dps_dial#augends"] = {
    "decimal",
    "hex",
    "binary",
    "date-slash",
    "date-hyphen",
    "case",
    {
      kind = "constant",
      opts = {
        elements = { "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday" },
        cycle = true,
        word = true,
      },
    },
    {
      kind = "constant",
      opts = {
        elements = { "Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun" },
        cycle = true,
        word = true,
      },
    },
    {
      kind = "constant",
      opts = {
        elements = { "月", "火", "水", "木", "金", "土", "日" },
        cycle = true,
        word = false,
      },
    },
    {
      kind = "constant",
      opts = {
        elements = { "０", "１", "２", "３", "４", "５", "６", "７", "８", "９" },
        cycle = true,
        word = false,
      },
    },
    {
      kind = "constant",
      opts = {
        elements = { "〇", "一", "二", "三", "四", "五", "六", "七", "八", "九" },
        cycle = true,
        word = false,
      },
    },
    {
      kind = "constant",
      opts = {
        elements = { "true", "false" },
        cycle = true,
        word = true,
      },
    },
    {
      kind = "constant",
      opts = {
        elements = { "True", "False" },
        cycle = true,
        word = true,
      },
    },
  }
  vim.api.nvim_create_autocmd("FileType", {
    pattern = "markdown",
    callback = function()
      vim.b.dps_dial_augends = vim.fn.extendnew(vim.g["dps_dial#augends"], {
        {
          kind = "constant",
          opts = {
            elements = { "[ ]", "[x]" },
            cycle = true,
            word = false,
          },
        }
      })
    end,
  }
  )
'''
lua_add = """
  vim.keymap.set({'n', 'x'}, "<C-a>", "<Plug>(dps-dial-increment)", { remap = true, desc = "dps-dial: increment the value under the cursor / in the selection" })
  vim.keymap.set({'n', 'x'}, "<C-x>", "<Plug>(dps-dial-decrement)", { remap = true, desc = "dps-dial: decrement the value under the cursor / in the selection" })
  vim.keymap.set('x', "g<C-a>", "g<Plug>(dps-dial-increment)", { remap = true, desc = "dps-dial: increment the selection progressively line by line" })
  vim.keymap.set('x', "g<C-x>", "g<Plug>(dps-dial-decrement)", { remap = true, desc = "dps-dial: decrement the selection progressively line by line" })
"""


