[[plugins]]
repo = "monaqa/dps-dial.vim"
depends = "denops.vim"
on_map = "<Plug>(dps-dial"
lua_source = '''
  vim.g["dps_dial#augends"] = {
    "decimal",
    "hex",
    "binary",
    "date-slash",
    "date-hyphen",
    "case",
    {
      kind = "constant",
      opts = {
        elements = { "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday" },
        cycle = true,
        word = true,
      },
    },
    {
      kind = "constant",
      opts = {
        elements = { "Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun" },
        cycle = true,
        word = true,
      },
    },
    {
      kind = "constant",
      opts = {
        elements = { "月", "火", "水", "木", "金", "土", "日" },
        cycle = true,
        word = false,
      },
    },
    {
      kind = "constant",
      opts = {
        elements = { "０", "１", "２", "３", "４", "５", "６", "７", "８", "９" },
        cycle = true,
        word = false,
      },
    },
    {
      kind = "constant",
      opts = {
        elements = { "〇", "一", "二", "三", "四", "五", "六", "七", "八", "九" },
        cycle = true,
        word = false,
      },
    },
    {
      kind = "constant",
      opts = {
        elements = { "true", "false" },
        cycle = true,
        word = true,
      },
    },
    {
      kind = "constant",
      opts = {
        elements = { "True", "False" },
        cycle = true,
        word = true,
      },
    },
  }
  vim.api.nvim_create_autocmd("FileType", {
    pattern = "markdown",
    callback = function()
      vim.b.dps_dial_augends = vim.fn.extendnew(vim.g["dps_dial#augends"], {
        {
