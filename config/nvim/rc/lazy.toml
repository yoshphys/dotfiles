# parentheses ####################################
##################################################

[[plugins]] # auto close parentheses
repo = "cohama/lexima.vim"
on_event = "InsertEnter"
# lua_add = """
#   vim.keymap.set('i', "<CR>",
#     function()
#       if vim.fn["pum#visible"]() == 1 then
#         return vim.fn["pum#map#confirm"]()
#       else
#         return "<C-r>=lexima#expand('<LT>CR>', 'i')<CR>"
#       end
#     end,
#     {silent = true, expr = true})
# """
hook_source = '''
  let g:lexima_ctrlh_as_backspace = 1
  let s:filetypes = ['latex', 'typst', 'markdown']
  call lexima#add_rule(#{
        \ char: '$',
        \ input_after: '$',
        \ filetype: s:filetypes,
        \ })
  call lexima#add_rule(#{
        \ char: '$',
        \ at: '\%#\$',
        \ leave: 1,
        \ filetype: s:filetypes,
        \ })
  call lexima#add_rule(#{
        \ char: '<BS>',
        \ at: '\$\%#\$',
        \ delete: 1,
        \ filetype: s:filetypes,
        \ })
  call lexima#add_rule(#{
        \ char: '<CR>',
        \ at: '\$\%#\$',
        \ input_after: '<CR>',
        \ filetype: s:filetypes,
        \ })
  call lexima#add_rule(#{
        \ char: '<CR>',
        \ at: '\$\%#$',
        \ input_after: '<CR>',
        \ except: '\C\v^(\s*)\S.*%#\n%(%(\s*|\1\s.+)\n)*\1\$',
        \ filetype: s:filetypes,
        \ })

  " to avoid inserting double space at a checkbox in markdown
  call lexima#add_rule(#{
        \ char: '<Space>',
        \ at: '\v^\s*\-\s+\[%#].*$',
        \ filetype: 'markdown',
        \ })
'''


