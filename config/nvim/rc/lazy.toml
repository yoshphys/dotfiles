##################################################
# fuzzy finder ###################################
##################################################

[[plugins]] # the eventual successor of Shougo/ddu-ui-ff; only
# ;h/;H/;r/;R/;b/;s/;T/;d are ported so far, the rest of rc/ddu.lua's
# pickers stay on ddu until migrated too. Ships its own default pickers
# (file, rg, help, history, buffer, ...) with no custom.lua needed;
# rc/lese/custom.lua adds "register", "snippet", "keymap", "tab" and
# "diagnostic", which lese has no source for (and excludes its own
# floating-window buffers from "buffer", see exclude_ephemeral_buffers
# there).
repo = "lambdalisue/vim-lese"
on_cmd = "Lese*"
# Forces goda-cmp.vim to load (if it hasn't already via its own on_event)
# before vim-lese's own plugin files do: lese's internal mapping save/
# restore around a picker session (see hook_source below) takes its
# "previous mappings" snapshot once, lazily, the first time any :Lese
# command runs, and never retakes it afterward. If that first snapshot is
# taken before goda-cmp.vim has ever loaded, every picker close for the
# rest of the session restores to that snapshot's absence of goda-cmp's
# own <C-n>/<C-p>/<C-y> cmdline mappings, breaking cmdline completion
# outside lese entirely until nvim restarts.
depends = "goda-cmp.vim"
hook_add = '''
  " Unset, this defaults to stdpath('config') .. '/lese/custom.lua'
  " (outside this repo, same issue as g:goda_term#config_dir /
  " g:goda_cmp#config_dir). lese falls back to its own bundled custom.lua
  " until a file actually exists at this path (":LeseCustom" creates it
  " here on first use), so setting this now is safe either way.
  let g:lese_custom_path = $VIM_CONFIG_PATH .. "/rc/lese/custom.lua"

  " ;h/;H used to be ddu's command_history/help pickers (see rc/ddu.lua,
  " commented out there to avoid the key clash); ;r takes over from ddu's
  " register picker's key, so the register picker itself moved to ;R; ;b
  " takes over ddu's buffer picker's key outright (same picker, 1:1).
  nnoremap ;h <Cmd>Lese history<CR>
  nnoremap ;H <Cmd>Lese help<CR>
  nnoremap ;r <Cmd>Lese rg<CR>
  nnoremap ;R <Cmd>Lese register<CR>
  nnoremap ;b <Cmd>Lese buffer<CR>
  " ;T: switch to another tab page, via rc/lese/custom.lua's "tab"
  " picker, which lese has no source for.
  nnoremap ;T <Cmd>Lese tab<CR>
  " ;d: jump to an LSP diagnostic (ddu-source-lsp's old job, replaced with
  " diagnostics rather than code actions -- more useful, and a closer fit
  " for how this config already does LSP, see rc/lspconfig.lua), via
  " rc/lese/custom.lua's "diagnostic" picker. Neovim only (vim.diagnostic
  " has no portable equivalent); a no-op on plain Vim.
  nnoremap ;d <Cmd>Lese diagnostic<CR>
  " Insert a vim-vsnip snippet for the current filetype without typing its
  " prefix; ddu's own ";t" (sonictemplate, a different, whole-file-template
  " concept) is untouched.
  " The bufnr is passed explicitly as an arg, the same convention
  " builtin.source.line uses, rather than relying on collect() reading "%"
  " itself.
  nnoremap <expr> ;s '<Cmd>Lese snippet ' .. bufnr('%') .. '<CR>'

  " <F1>: browse the current mode's keymaps (global + buffer-local),
  " including lese's own default ones once inside a picker. One mapping
  " per mode, each passing its own literal mode char as :Lese's arg
  " (rc/lese/custom.lua's "keymap" picker), not mode() -- by the time
  " :Lese runs the mode may already differ. No cnoremap <F1>: lese's own
  " default mappings already claim <F1> inside a picker itself (toggle
  " its help window), and a global cnoremap would silently clobber that
  " the same way goda-cmp's did for <C-n>/<C-p>/<C-g> (see above).
  nnoremap <F1> <Cmd>Lese keymap n<CR>
  inoremap <F1> <Cmd>Lese keymap i<CR>
  xnoremap <F1> <Cmd>Lese keymap x<CR>
'''
hook_source = '''
  " lese's own floating windows never take focus, so it actually reads its
  " search box through Vim's input(). Re-asserting lese's own <C-n>/<C-p>/
  " <C-g> cnoremap once on LesePickerEnter (see :help LesePickerEnter)
  " wasn't enough: goda_cmp#enable() registers its OWN permanent, always-on
  " "autocmd CmdlineChanged * if s:input_cmdline() | call
  " s:on_change('CmdlineChanged') | endif" (rc/goda-cmp/main.go's
  " CmdlineSources has no "@" entry any more, but that autocmd isn't gated
  " on CmdlineSources having anything in it, or on goda_cmp#enable_cmdline()
  " / disable_cmdline() -- only goda_cmp#disable() removes it), which fires
  " on every keystroke in lese's search box and re-claims the keys. Turn
  " goda-cmp off entirely for the duration of the picker instead of
  " fighting it mapping-by-mapping.
  function s:lese_picker_enter() abort
    call goda_cmp#disable()
    cnoremap <nowait> <C-n> <Plug>(lese-list-next)
    cnoremap <nowait> <C-p> <Plug>(lese-list-prev)
    cnoremap <nowait> <C-g> <Plug>(lese-list-last)
  endfunction

  function s:lese_picker_leave() abort
    call goda_cmp#enable()
  endfunction

  augroup lese-reclaim-mappings
    autocmd! *
    autocmd User LesePickerEnter:* call s:lese_picker_enter()
    autocmd User LesePickerLeave:* call s:lese_picker_leave()
  augroup END
'''


