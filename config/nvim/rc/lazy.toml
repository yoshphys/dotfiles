[[plugins]]
repo = "monaqa/dps-dial.vim"
depends = "denops.vim"
on_map = "<Plug>(dps-dial"
hook_source = '''
  let g:dps_dial#augends = [
        \ 'decimal',
        \ 'hex',
        \ 'binary',
        \ 'date-slash',
        \ 'date-hyphen',
        \ 'case',
        \ #{
        \   kind: 'constant',
        \   opts: #{
        \     elements: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'],
        \     cycle: v:true,
        \     word: v:true,
        \   },
        \ },
        \ #{
        \   kind: 'constant',
        \   opts: #{
        \     elements: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
        \     cycle: v:true,
        \     word: v:true,
        \   },
        \ },
        \ #{
        \   kind: 'constant',
        \   opts: #{
        \     elements: ['月', '火', '水', '木', '金', '土', '日'],
        \     cycle: v:true,
        \     word: v:false,
        \   },
        \ },
        \ #{
        \   kind: 'constant',
        \   opts: #{
        \     elements: ['０', '１', '２', '３', '４', '５', '６', '７', '８', '９'],
        \     cycle: v:true,
        \     word: v:false,
        \   },
        \ },
        \ #{
        \   kind: 'constant',
        \   opts: #{
        \     elements: ['〇', '一', '二', '三', '四', '五', '六', '七', '八', '九'],
        \     cycle: v:true,
        \     word: v:false,
        \   },
        \ },
        \ #{
        \   kind: 'constant',
        \   opts: #{
        \     elements: ['true', 'false'],
        \     cycle: v:true,
        \     word: v:true,
        \   },
        \ },
        \ #{
        \   kind: 'constant',
        \   opts: #{
        \     elements: ['True', 'False'],
        \     cycle: v:true,
        \     word: v:true,
        \   },
        \ },
        \ ]

  autocmd MyAutoCmd FileType markdown
        \ let b:dps_dial_augends = extendnew(g:dps_dial#augends, [#{
        \   kind: 'constant',
        \   opts: #{
        \     elements: ['[ ]', '[x]'],
        \     cycle: v:true,
        \     word: v:false,
        \   },
        \ }])
'''
hook_add = """
  nmap <C-a> <Plug>(dps-dial-increment)
  xmap <C-a> <Plug>(dps-dial-increment)
  nmap <C-x> <Plug>(dps-dial-decrement)
  xmap <C-x> <Plug>(dps-dial-decrement)
  xmap g<C-a> g<Plug>(dps-dial-increment)
  xmap g<C-x> g<Plug>(dps-dial-decrement)
"""


