##################################################

[[multiple_hooks]] # start up an IDE like environment
plugins = ["nvim-aibo", "goda-term-ui-shell.vim"]
hook_source = '''
  " Layout: [ goda-term-shell | current_buffer ]
  "         [ Aibo            |                ]
  " s:aiboide_orig_buf/args stand in for what a Lua closure would capture:
  " vimscript functions can't close over locals, and the layout has to be
  " built from a ++once FileType autocmd (not inline here), since
  " goda_term#start() is async and may close windows created beforehand.
  function s:AiboIDE(args) abort
    let s:aiboide_orig_buf = bufnr('%')
    let s:aiboide_args = a:args

    autocmd MyAutoCmd FileType goda-term-shell ++once call s:AiboIDE_layout()

    call goda_term#start(#{
          \   name: printf('aibo-%d', win_getid()),
          \   ui: 'shell',
          \ })
  endfunction

  function s:AiboIDE_layout() abort
    let term_win = win_getid()

    rightbelow vsplit
    if bufexists(s:aiboide_orig_buf)
      execute 'buffer' s:aiboide_orig_buf
    else
      enew
    endif

    call win_gotoid(term_win)
    belowright split
    execute 'Aibo' s:aiboide_args

    call win_gotoid(term_win)
  endfunction

  command! -nargs=+ AiboIDE call s:AiboIDE(<q-args>)
'''
