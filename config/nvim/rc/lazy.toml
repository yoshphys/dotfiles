[[plugins]]
repo = 'Shougo/pum.vim'
# <C-d>/<C-u> do nothing (not even the default scroll) when the preview
# isn't visible, matching the original Lua callback returning nothing.
hook_add = '''
  inoremap <expr> <C-d> pum#preview_visible() ? pum#map#scroll_preview(4) : ''
  cnoremap <expr> <C-d> pum#preview_visible() ? pum#map#scroll_preview(4) : ''
  inoremap <expr> <C-u> pum#preview_visible() ? pum#map#scroll_preview(-4) : ''
  cnoremap <expr> <C-u> pum#preview_visible() ? pum#map#scroll_preview(-4) : ''
'''
hook_source = '''
  " Alternatives: border: 'none', max_width: 80, preview: false,
  " preview_width: 80.
  call pum#set_option(#{
        \   auto_confirm_time: 0,
        \   auto_select: v:true,
        \   border: 'single',
        \   commit_characters: ['.'],
        \   highlight_scrollbar: 'None',
        \   insert_preview: v:true,
        \   max_width: 0,
        \   offset_cmdcol: 0,
        \   offset_cmdrow: 1,
        \   padding: v:false,
        \   preview: v:true,
        \   preview_border: 'single',
        \   reversed: v:false,
        \   scrollbar_char: '║',
        \   use_setline: v:false,
        \ })
  " call pum#set_local_option('c', #{ max_width: 0 })

  " NOTE: For horizontal_menu
  call pum#set_option(#{
        \   follow_cursor: v:false,
        \   horizontal_menu: v:false,
        \   max_horizontal_items: 2,
        \   max_height: 3,
        \ })
'''

[[plugins]] # friendly-snippets' package.json is what vsnip's vscode-
# extension-style source scans for, so it must be on runtimepath by the
# time vsnip first runs, hence on_source rather than its own trigger.
