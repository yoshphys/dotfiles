[[multiple_hooks]] # start up an IDE like environment
plugins = ["nvim-aibo", "goda-term-ui-shell.vim"]
hook_source = """
lua << EOF
  -- Layout: [ goda-term-shell | current_buffer ]
  --         [ Aibo            |                ]
  vim.api.nvim_create_user_command("AiboIDE", function(opts)

    -- Save the current buffer before goda-term-shell takes over
    local orig_buf = vim.api.nvim_get_current_buf()

    -- Build the entire layout after goda-term-shell opens, because
    -- goda_term#start (async) may close windows created beforehand
    vim.api.nvim_create_autocmd("FileType", {
      pattern = "goda-term-shell",
      once = true,
      callback = function()
        local term_win = vim.api.nvim_get_current_win()

        -- Create right column for the original buffer
        vim.cmd("rightbelow vsplit")
        if vim.api.nvim_buf_is_valid(orig_buf) then
          vim.api.nvim_win_set_buf(0, orig_buf)
        else
          vim.cmd("enew")
        end

        -- Back to goda-term-shell; split below for Aibo
        vim.api.nvim_set_current_win(term_win)
        vim.cmd("belowright split")
        vim.cmd("Aibo " .. opts.args)

        -- Leave focus on goda-term-shell
        vim.api.nvim_set_current_win(term_win)
      end,
    })

    vim.fn["goda_term#start"]({
      name = "aibo-" .. tostring(vim.fn.win_getid()),
      ui = "shell",
    })
  end, { nargs = "+" })
EOF
"""
