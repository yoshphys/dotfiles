on_source = "vim-vsnip"

[[plugins]] # snippet engine, the successor of denippet.vim (removed).
# Picked through lese's ";s" (rc/lese/custom.lua); a goda-cmp completion
# source is a separate, later task.
repo = 'hrsh7th/vim-vsnip'
on_func = 'vsnip#'
hook_add = '''
  let g:vsnip_snippet_dir = $VIM_CONFIG_PATH .. '/snippets/vsnip'

  imap <expr> <Tab> vsnip#jumpable(1) ? '<Plug>(vsnip-jump-next)' : '<Tab>'
  smap <expr> <Tab> vsnip#jumpable(1) ? '<Plug>(vsnip-jump-next)' : '<Tab>'
  imap <expr> <S-Tab> vsnip#jumpable(-1) ? '<Plug>(vsnip-jump-prev)' : '<S-Tab>'
  smap <expr> <S-Tab> vsnip#jumpable(-1) ? '<Plug>(vsnip-jump-prev)' : '<S-Tab>'
'''

[[multiple_hooks]]
plugins = ["goda-cmp.vim", "pum.vim"]
hook_add = '''
  " Same expr-mapping pattern as rc/goda-cmp.vim's cnoremap <C-n>/<C-p>,
  " just for insert mode here.
  inoremap <expr> <C-n>
        \   pum#visible()
        \ ? pum#map#select_relative(1)
        \ : goda_cmp#map#manual_complete()
  inoremap <expr> <C-p>
        \   pum#visible()
        \ ? pum#map#select_relative(-1)
        \ : goda_cmp#map#manual_complete()
'''


