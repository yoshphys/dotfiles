[[plugins]]
repo = "eetann/editprompt.nvim"
on_cmd = "Editprompt"
lua_add = """
  -- Map only in buffers opened by the editprompt CLI (e.g. .editprompt-20261008162544-e972554e.md)
  vim.api.nvim_create_autocmd('BufEnter', {
    pattern = '*/.editprompt-*.md',
    callback = function(args)
      vim.keymap.set('n', "[Space]ei", "<Cmd>Editprompt input --auto-send<CR>", { buffer = args.buf, desc = "editprompt: send the buffer to the target pane and auto-send" })
      vim.keymap.set('n', "[Space]eI", "<Cmd>Editprompt input<CR>", { buffer = args.buf, desc = "editprompt: send the buffer to the target pane without auto-send" })
      vim.keymap.set('x', "[Space]ei", "<Cmd>Editprompt input --visual --auto-send<CR>", { buffer = args.buf, desc = "editprompt: send the selected lines to the target pane and auto-send" })
      vim.keymap.set('n', "[Space]ep", "<Cmd>Editprompt history prev<CR>", { buffer = args.buf, desc = "editprompt: recall the previous prompt from history" })
      vim.keymap.set('n', "[Space]en", "<Cmd>Editprompt history next<CR>", { buffer = args.buf, desc = "editprompt: recall the next prompt from history" })
      vim.keymap.set('n', "[Space]eh", "<Cmd>Editprompt history list<CR>", { buffer = args.buf, desc = "editprompt: pick a prompt from history and insert it" })
      vim.keymap.set('n', "[Space]ek", "<Cmd>Editprompt press_mode<CR>", { buffer = args.buf, desc = "editprompt: enter press mode (forward keys to the target pane)" })
      vim.keymap.set('n', "[Space]es", "<Cmd>Editprompt stash pop<CR>", { buffer = args.buf, desc = "editprompt: restore (pop) the stashed content" })
      vim.keymap.set('n', "[Space]eS", "<Cmd>Editprompt stash push<CR>", { buffer = args.buf, desc = "editprompt: stash the buffer content" })
    end,
  })
"""
lua_source = """
  -- The plugin ships no plugin/ directory, so setup() is what registers the
  -- real :Editprompt command. Needed even with no options to override.
  require("editprompt").setup()
"""

[[plugins]]
repo = "lambdalisue/nvim-aibo"
on_cmd = "Aibo*"
lua_add = """
  vim.keymap.set('v', "<C-g><C-s>", ":<C-u>'<,'>AiboSend -input<CR>", { silent = true, desc = "aibo: send the selected lines to the console prompt" })
"""
lua_source = """
  require("aibo").setup({
    console = {
      on_attach = function(bufnr, info)
        vim.bo[bufnr].buflisted = true
      end,
    },
    prompt = {
      no_default_mappings = true,
      on_attach = function(bufnr, info)
        -- these maps are from nvim-aibo/ftplugin/aibo-prompt.lua excluding <C-n> and <C-p>
        vim.keymap.set({ "n", "i" }, "<C-g><C-o>", "<Plug>(aibo-send)", { buffer = bufnr, nowait = true, desc = "aibo-prompt: send the next typed key to the console" })
        vim.keymap.set("n", "<CR>", "<Plug>(aibo-submit)", { buffer = bufnr, nowait = true, silent = true, desc = "aibo-prompt: submit the prompt to the console" })
        vim.keymap.set("n", "<Esc>", "<Cmd>q<CR>", { buffer = bufnr, nowait = true, silent = true, desc = "aibo-prompt: close the prompt window" })
        vim.keymap.set("n", "<C-Enter>", "<Plug>(aibo-submit)<Cmd>q<CR>", { buffer = bufnr, nowait = true, silent = true, desc = "aibo-prompt: submit the prompt and close the window" })
        vim.keymap.set("n", "<F5>", "<Plug>(aibo-submit)<Cmd>q<CR>", { buffer = bufnr, nowait = true, silent = true, desc = "aibo-prompt: submit the prompt and close the window" })
        vim.keymap.set("i", "<C-Enter>", "<Esc><Plug>(aibo-submit)<Cmd>q<CR>", { buffer = bufnr, nowait = true, silent = true, desc = "aibo-prompt: submit the prompt and close the window" })
        vim.keymap.set("i", "<F5>", "<Esc><Plug>(aibo-submit)<Cmd>q<CR>", { buffer = bufnr, nowait = true, silent = true, desc = "aibo-prompt: submit the prompt and close the window" })
        vim.keymap.set("n", "<C-c>", "<Plug>(aibo-send)<Esc>", { buffer = bufnr, nowait = true, silent = true, desc = "aibo-prompt: send <Esc> to the console" })
        vim.keymap.set("n", "g<C-c>", "<Plug>(aibo-send)<C-c>", { buffer = bufnr, nowait = true, silent = true, desc = "aibo-prompt: send <C-c> (interrupt) to the console" })
        vim.keymap.set("n", "<C-l>", "<Plug>(aibo-send)<C-l>", { buffer = bufnr, nowait = true, silent = true, desc = "aibo-prompt: send <C-l> (clear) to the console" })
        vim.keymap.set("n", "<C-n>", "<Plug>(aibo-send)<C-n>", { buffer = bufnr, nowait = true, silent = true, desc = "aibo-prompt: send <C-n> (next history) to the console" })
        vim.keymap.set("n", "<C-p>", "<Plug>(aibo-send)<C-p>", { buffer = bufnr, nowait = true, silent = true, desc = "aibo-prompt: send <C-p> (previous history) to the console" })
        vim.keymap.set("n", "<Down>", "<Plug>(aibo-send)<Down>", { buffer = bufnr, nowait = true, silent = true, desc = "aibo-prompt: send <Down> to the console" })
        vim.keymap.set("n", "<Up>", "<Plug>(aibo-send)<Up>", { buffer = bufnr, nowait = true, silent = true, desc = "aibo-prompt: send <Up> to the console" })
      end,
    },
    tools = {
      julia = {
        on_attach = function(bufnr, info)
          pcall(vim.treesitter.start, bufnr, "julia")
          vim.lsp.start({
            name = "jetls",
            cmd = { "jetls", "serve" },
            root_dir = vim.fs.root(vim.fn.getcwd(), { "Project.toml" }) or vim.fn.getcwd(),
          }, { bufnr = bufnr })
        end,
      },
      python = {
        on_attach = function(bufnr, info)
          pcall(vim.treesitter.start, bufnr, "python")
          vim.lsp.start({
            name = "basedpyright",
            cmd = { "basedpyright-langserver", "--stdio" },
            root_dir = vim.fs.root(vim.fn.getcwd(), { "pyproject.toml", "setup.py", ".git" }) or vim.fn.getcwd(),
          }, { bufnr = bufnr })
        end,
      },
      claude = {
        on_attach = function(bufnr, info)
          pcall(vim.treesitter.start, bufnr, "markdown")
        end,
      },
    },
  })
  vim.api.nvim_create_user_command("AiboVsplit", function(opts)
    vim.cmd("Aibo -opener=vsplit " .. opts.args)
  end, { nargs = "+" })
  vim.api.nvim_create_autocmd("FileType", {
    pattern = "aibo-prompt*",
    callback = function()
      for _, dir in ipairs({ "h", "j", "k", "l", "w", "W" }) do
        vim.keymap.set("n", "<C-w>" .. dir, function()
          vim.cmd("q")
          vim.schedule(function()
            vim.cmd("wincmd " .. dir)
          end)
        end, { buffer = true, desc = "aibo-prompt: close the prompt and run <C-w>" .. dir })
      end
    end,
  })
"""

