##################################################
# Neovim-only plugins go here: ones that don't work
# under plain Vim at all (as opposed to lazy.toml/
# merge.toml, which still assume Neovim today but
# aren't excluded from a future plain-Vim target).
##################################################

[[plugins]] # nerd icons
repo = "nvim-tree/nvim-web-devicons"

[[plugins]] # statusline on the bottom
repo = "nvim-lualine/lualine.nvim"
# VimEnter: the earliest lazy trigger, so the statusline is stable from the
# first frame (merge.toml's eager plugins still load slightly earlier, but
# this is Neovim-only so it can't go there; see nvim-notify for the same
# pattern).
depends = ["catppuccin", "nvim-web-devicons"]
on_event = "VimEnter"
lua_source = """
  local lsp_names = function()
    local clients = vim
      .iter(vim.lsp.get_clients { bufnr = 0 })
      :map(function(client)
        if client.name == 'null-ls' then
          return ('null-ls(%s)'):format(table.concat(
            vim
              .iter(require('null-ls.sources').get_available(vim.bo.filetype))
              :map(function(source)
                return source.name
              end)
              :totable(),
            ', '
          ))
        else
          return client.name
        end
      end)
      :totable()
    return ' ' .. table.concat(clients, ', ')
  end

  require("lualine").setup({
    options = {
      theme = "auto",
    },
    sections = {
      lualine_x = { lsp_names, "encoding", "fileformat", "filetype" },
    },
  })
"""

